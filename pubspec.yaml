name: mazkiplay_ai
description: Mazkiplay AI - Security & Trading Assistant
publish_to: none
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  audioplayers: ^6.0.0
  flutter_markdown: ^0.7.1
  url_launcher: ^6.2.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sound/

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#E53935"
  adaptive_icon_foreground: "assets/logo.png"
