name: mazkiplay_ai
description: Mazkiplay AI - local-first OpenRouter assistant
publish_to: none
version: 1.1.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  audioplayers: ^6.0.0
  flutter_markdown: ^0.7.1
  url_launcher: ^6.2.0
  video_player: ^2.10.1
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sound/

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#09090F"
  adaptive_icon_foreground: "assets/logo.png"
